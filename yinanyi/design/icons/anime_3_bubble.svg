  <!-- 眼睛 -->
  <ellipse cx="42" cy="52" rx="6" ry="8" fill="#2D3A8C"/>
  <ellipse cx="42" cy="55" rx="4.6" ry="4.8" fill="#4FA8FF"/>
  <circle cx="40" cy="48.8" r="2.4" fill="#FFFFFF"/>
  <circle cx="44.2" cy="57.6" r="1.1" fill="#FFFFFF"/>
  <ellipse cx="66" cy="52" rx="6" ry="8" fill="#2D3A8C"/>
  <ellipse cx="66" cy="55" rx="4.6" ry="4.8" fill="#4FA8FF"/>
  <circle cx="64" cy="48.8" r="2.4" fill="#FFFFFF"/>
  <circle cx="68.2" cy="57.6" r="1.1" fill="#FFFFFF"/>
  <!-- 腮红、嘴 -->
  <ellipse cx="33" cy="63" rx="4.5" ry="2.4" fill="#FF9EB8"/>
  <ellipse cx="75" cy="63" rx="4.5" ry="2.4" fill="#FF9EB8"/>
  <path d="M49 63 Q51.5 66.5 54 63 Q56.5 66.5 59 63" fill="none" stroke="#2D3A8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
